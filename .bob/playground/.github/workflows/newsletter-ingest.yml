name: Newsletter Ingest

on:
  repository_dispatch:
    types: [newsletter_ingest]

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode payload and write to temp file
        # client_payload.body may be base64-encoded or plain text.
        # We try base64 decode first; if that fails we write it as-is.
        run: |
          BODY='${{ github.event.client_payload.body }}'
          echo "$BODY" | base64 --decode > newsletter_input.txt 2>/dev/null \
            || echo "$BODY" > newsletter_input.txt

      - name: Parse newsletter and update jobs.json
        run: python parse_newsletter.py newsletter_input.txt

      - name: Write meta.json
        run: |
          python - <<'EOF'
          import json, datetime, pathlib
          pathlib.Path("data").mkdir(exist_ok=True)
          pathlib.Path("data/meta.json").write_text(
              json.dumps({
                  "lastRefreshed": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "source": "github-actions"
              }, indent=2)
          )
          EOF

      - name: Commit changes if jobs.json or queue changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json data/meta.json data/newsletter_queue.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: ingest newsletter jobs [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Clean up temp file
        if: always()
        run: rm -f newsletter_input.txt
